name: Update arXiv publications

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/update_arxiv.py
      - .github/workflows/update-arxiv.yml

permissions:
  contents: write

concurrency:
  group: update-arxiv
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch arXiv publications
        run: python3 scripts/update_arxiv.py
      - name: Save refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/arxiv.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Update arXiv publication data'
          git push origin HEAD:master
